<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Smasher 3D</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "cannon-es": "https://esm.sh/cannon-es@0.20.0"
            }
        }
    </script>
</head>
<body>

    <div id="controls-hint">WASD to Drive Selected • Drag to Smash</div>
    
    <button id="drive-btn" class="game-btn hidden">DRIVE</button>

    <!-- Main Menu -->
    <div id="menu-layer">
        <div id="main-menu">
            <h1>SMASH SANDBOX 3D</h1>
            <button id="play-btn" class="menu-btn">PLAY</button>
        </div>
        
        <div id="map-selection" class="hidden">
            <h2>SELECT MAP</h2>
            <div class="map-grid">
                <button class="map-btn" data-map="plane">Plane</button>
                <button class="map-btn" data-map="racetrack">Racetrack</button>
                <button class="map-btn" data-map="city">City</button>
                <button class="map-btn" data-map="nyc">New York</button>
                <button class="map-btn" data-map="la">Los Angeles</button>
                <button class="map-btn" data-map="subway">Subway Stn</button>
                <button class="map-btn" data-map="beach">Beach</button>
                <button class="map-btn" data-map="house">House</button>
                <button class="map-btn" data-map="globe">Globe</button>
            </div>
            <button id="back-btn" class="menu-btn small">Back</button>
        </div>
    </div>

    <!-- Game UI -->
    <div id="game-ui" class="hidden">
        <div id="game-container"></div>

        <!-- Vehicle Context Menu -->
        <div id="vehicle-menu" class="hidden context-menu">
            <h3>Vehicle Options</h3>
            <div class="menu-grid">
                <button id="vm-freeze">Freeze</button>
                <button id="vm-destroy">Destroy</button>
                <button id="vm-explode">Explode</button>
                <button id="vm-drive">Toggle Auto-Drive</button>
                <button id="vm-visible">Invisible</button>
                <button id="vm-immortal">Immortal</button>
                <button id="vm-gravity">No Gravity</button>
                <button id="vm-collision">No Collision</button>
            </div>
            <button class="close-menu-btn">Close</button>
        </div>

        <!-- Global Context Menu -->
        <div id="global-menu" class="hidden context-menu">
            <h3>Sandbox Options</h3>
            <div class="menu-grid">
                <button id="gm-pop">Pop Up Everyone</button>
                <button id="gm-explode">Explode All</button>
                <button id="gm-reset">Reset All</button>
            </div>
            <button class="close-menu-btn">Close</button>
        </div>
        
        <div id="top-bar">
            <button id="exit-btn">Menu</button>
            <div id="score-display">Destroyed: 0</div>
            <button id="theme-btn">Light Mode</button>
        </div>

        <div id="inventory-container">
            <div id="category-tabs">
                <button class="tab-btn active" data-category="cars">Cars</button>
                <button class="tab-btn" data-category="trains">Trains</button>
                <button class="tab-btn" data-category="air">Air</button>
                <button class="tab-btn" data-category="boats">Boats</button>
                <button class="tab-btn" data-category="disasters">Disasters</button>
            </div>
            <div id="inventory-scroll">
                <div id="inventory-grid"></div>
            </div>
        </div>
        
        <button id="reset-btn">Clear Objects</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
